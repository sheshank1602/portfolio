<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="description" content="Ilaveni Sheshank - QA Automation & Manual Testing Engineer. Python, Robot Framework, Selenium, Pytest, API & JWT testing.">
<title>Ilaveni Sheshank — QA Automation Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --bg2:#0e0e11; --card:#101014; --line:#1f1f26; --line2:#2a2a33;
  --text:#fafafa; --muted:#a1a1aa; --dim:#71717a;
  --blue:#3b82f6; --blue2:#60a5fa; --green:#22c55e; --green2:#4ade80; --purple:#a78bfa;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;overflow-x:hidden;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
ul{list-style:none}
img{max-width:100%;display:block}
.mono{font-family:var(--mono)}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}
section{scroll-margin-top:70px}
::selection{background:var(--blue);color:#fff}
header,main,footer{position:relative;z-index:1}

/* ===== NAV ===== */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(10,10,11,.96);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:10px}
.logo{font-family:var(--sans);font-weight:700;font-size:19px;letter-spacing:-.3px;white-space:nowrap}
.logo i{font-style:normal;color:var(--blue);font-weight:500}
.links{display:none;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.links a{padding:6px 8px;transition:color .2s}
.links a:hover,.links a.active{color:var(--text)}
.links .sl{color:var(--line2)}
.right{display:flex;align-items:center;gap:6px}
.lc{font-weight:500;font-size:14px;padding:8px 6px;color:var(--text);transition:color .2s}
.lc:hover{color:var(--blue2)}
.burger{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.burger span,.burger span::before,.burger span::after{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;position:relative;transition:.25s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0}
.burger span::before{top:-6px}.burger span::after{top:6px}
.burger.open span{background:transparent}
.burger.open span::before{top:0;transform:rotate(45deg)}
.burger.open span::after{top:0;transform:rotate(-45deg)}
.mobile{display:none;background:var(--bg);border-bottom:1px solid var(--line)}
.mobile.open{display:block}
.mobile a{display:flex;justify-content:space-between;padding:15px 20px;border-top:1px solid var(--line);font-weight:500;color:var(--muted)}
.mobile a:hover{color:var(--text)}
.mobile a small{font-family:var(--mono);color:var(--blue)}
#bar{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--blue)}
@media(min-width:900px){.links{display:flex}.burger{display:none}.mobile{display:none!important}.lc{padding:9px 18px;border:1px solid var(--line2);border-radius:999px;font-size:13px}.lc:hover{border-color:var(--blue)}}

/* ===== COMMON ===== */
.sec-no{font-family:var(--mono);font-size:13px;color:var(--blue);letter-spacing:.08em;display:block;margin-bottom:10px}
.sec-t{font-size:clamp(30px,6.5vw,52px);font-weight:600;letter-spacing:-.03em;line-height:1.1}
.sec-t.grey{color:#8a8a93}
.pad{padding:80px 0}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border:1px solid var(--line2);border-radius:999px;font-family:var(--mono);font-size:13px;color:var(--text);background:var(--bg2);transition:.2s}
.pill:hover{border-color:var(--blue);color:var(--blue2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 26px;border-radius:14px;font-weight:600;font-size:16px;transition:.2s}
.btn.blue{background:var(--blue);color:#fff}
.btn.blue:hover{background:#2563eb;transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(59,130,246,.7)}
.btn.line{border:1px solid var(--line2);color:var(--text)}
.btn.line:hover{border-color:var(--blue);color:var(--blue2)}

/* ===== HERO ===== */
.hero{padding:110px 0 30px}
.hero-top{display:grid;gap:30px;align-items:center}
.status{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:clamp(42px,11vw,92px);font-weight:700;letter-spacing:-.045em;line-height:1;margin:18px 0 14px}
.hero h1 em{font-style:normal;color:var(--blue)}
.role{font-family:var(--mono);font-size:clamp(13px,3.6vw,18px);color:var(--muted);margin-bottom:16px}
.role b{color:var(--text);font-weight:500}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--blue);margin-left:3px;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lead{color:var(--muted);font-size:clamp(16px,4vw,19px);max-width:600px}
.photo{position:relative;width:132px;height:132px;border-radius:50%;border:1px solid var(--line2);background:linear-gradient(160deg,#16161b,#0c0c0f);overflow:hidden;display:flex;align-items:center;justify-content:center}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.photo .in{font-size:44px;font-weight:700;letter-spacing:-.05em;color:var(--blue)}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 10px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.stats{margin-top:34px;border-top:1px solid var(--line)}
.stat{padding:36px 0;text-align:center;border-bottom:1px solid var(--line)}
.stat b{display:block;font-size:clamp(54px,15vw,84px);font-weight:600;letter-spacing:-.04em;line-height:1}
.stat b i{font-style:normal;color:var(--blue);font-size:.48em;font-weight:600;margin-left:6px;vertical-align:.5em}
.stat > span{display:block;margin-top:14px;font-family:var(--mono);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
@media(min-width:900px){
  .hero{padding:140px 0 40px}
  .hero-top{grid-template-columns:1.4fr .6fr}
  .intro{order:1}
  .photo-cell{order:2}
  .photo{width:100%;max-width:330px;height:auto;aspect-ratio:4/5;border-radius:26px;margin-left:auto}
  .photo .in{font-size:96px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:50px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stat{border-bottom:0;border-right:1px solid var(--line);padding:46px 0}
  .stat:last-child{border-right:0}
}

/* ===== ABOUT ===== */
.statement{font-size:clamp(26px,6.4vw,58px);font-weight:500;letter-spacing:-.03em;line-height:1.28;margin-top:36px;max-width:1000px}
.wr .w{opacity:.22;filter:blur(4px);transition:opacity .35s ease,filter .35s ease}
.wr .w.on{opacity:1;filter:none}
.statement .hl{color:var(--blue2)}
.about-p{margin-top:34px;max-width:760px;color:var(--muted);font-size:clamp(16px,4vw,19px)}
.about-p+.about-p{margin-top:14px}
.about-p b{color:var(--text);font-weight:600}

/* ===== SKILLS ===== */
.skills-head{display:flex;flex-direction:column;align-items:center;margin-bottom:46px}
.sbadge{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(59,130,246,.55);background:radial-gradient(circle,rgba(59,130,246,.2),rgba(10,10,11,.9) 70%);box-shadow:0 0 38px rgba(59,130,246,.35);font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.12em}
.cats{display:grid;gap:34px;max-width:860px;margin:0 auto}
.cat{position:relative;padding-left:58px}
.cat::before{content:"";position:absolute;left:21px;top:46px;bottom:-24px;width:1px;background:var(--line2)}
.cat:last-child::before{display:none}
.cat-ico{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.cat-ico svg{width:20px;height:20px}
.cat h3{font-size:19px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:44px}
.icons{display:flex;flex-wrap:wrap;gap:18px 14px;margin-top:12px}
.ic{width:72px;text-align:center}
.ic .c{width:60px;height:60px;margin:0 auto 8px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;transition:.25s;overflow:hidden}
.ic:hover .c{border-color:var(--blue);box-shadow:0 0 22px rgba(59,130,246,.3);transform:translateY(-3px)}
.ic img{width:30px;height:30px;object-fit:contain}
.ic img.inv{filter:invert(1)}
.ic .fb{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--blue2)}
.ic span.l{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.3;word-break:break-word}

/* ===== PROJECTS ===== */
.work{margin-top:42px;display:grid;gap:34px}
.proj{position:relative;border:1px solid var(--line);border-radius:26px;background:var(--card);overflow:hidden;transition:border-color .3s}
.proj:hover{border-color:rgba(59,130,246,.5)}
.vis{position:relative;background:linear-gradient(135deg,#0d1b33,#0b0b10 70%);overflow:hidden;display:flex;align-items:center;justify-content:center;padding:24px 22px 8px}
.vis::after{content:"";position:absolute;left:0;right:0;bottom:0;height:36px;background:linear-gradient(180deg,transparent,var(--card));pointer-events:none}
.vis::before{content:"";position:absolute;width:320px;height:320px;border-radius:50%;right:-80px;top:-120px;background:radial-gradient(circle,rgba(59,130,246,.35),transparent 65%)}
.term{position:relative;z-index:1;width:100%;max-width:420px;border:1px solid var(--line2);border-radius:14px;background:rgba(8,8,10,.92);overflow:hidden}
.term .tb{display:flex;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--dim)}
.term .tb i{width:9px;height:9px;border-radius:50%;background:#2f2f38}
.term .tb em{font-style:normal;margin-left:8px}
.term pre{padding:14px;font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.k{color:var(--purple)}.s{color:#fbbf24}.g{color:var(--green2)}.c{color:var(--blue2)}.d{color:var(--dim)}
.body{position:relative;z-index:2;padding:22px 24px 28px}
.badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.bd{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.bd.teal{border:1px solid rgba(45,212,191,.5);color:#5eead4;background:rgba(45,212,191,.08)}
.bd.grey{border:1px solid var(--line2);color:var(--muted);background:var(--bg2)}
.yr{font-family:var(--mono);font-size:12px;color:var(--dim)}
.body h3{font-size:clamp(28px,7vw,44px);font-weight:600;letter-spacing:-.03em;line-height:1.1;margin-bottom:14px}
.body p{color:var(--muted);font-size:16px;margin-bottom:18px}
.pts li{color:var(--muted);font-size:15px;padding-left:24px;position:relative;margin:9px 0}
.pts li::before{content:"→";position:absolute;left:0;color:var(--blue)}
.pts li b{color:var(--text);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-block;padding:6px 13px;border:1px solid var(--line2);border-radius:10px;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--bg2)}
.cnt{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.14em;margin-bottom:12px;display:block}
.cnt b{color:var(--blue);font-weight:500}
@media(min-width:900px){
  .proj{display:grid;grid-template-columns:1.05fr .95fr;min-height:420px}
  .proj:nth-child(even) .vis{order:2}
  .vis{padding:34px}
  .vis::after{left:auto;top:0;bottom:0;width:70px;height:auto;right:0;background:linear-gradient(90deg,transparent,var(--card))}
  .proj:nth-child(even) .vis::after{right:auto;left:0;background:linear-gradient(270deg,transparent,var(--card))}
  .body{margin-top:0;padding:44px 40px;align-self:center}
  .proj:nth-child(even) .body{order:1}
}

/* ===== EXPERIENCE ===== */
.xp{margin-top:42px;display:grid;gap:26px;max-width:900px}
.xcard{position:relative;border:1px solid var(--line);border-radius:26px;background:var(--card);overflow:hidden;transition:border-color .3s}
.xcard:hover{border-color:rgba(59,130,246,.45)}
.xtop{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line);position:relative}
.wd{display:flex;gap:7px}
.wd i{width:10px;height:10px;border-radius:50%;background:#2c2c34}
.xcard.act .wd i:first-child{background:var(--green)}
.dp{font-family:var(--mono);font-size:13px;padding:6px 16px;border-radius:999px}
.dp.g{color:var(--green2);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3)}
.dp.b{color:var(--blue2);background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35)}
.wm{position:absolute;right:14px;top:-4px;font-size:64px;font-weight:700;letter-spacing:-.04em;color:rgba(255,255,255,.035);pointer-events:none;line-height:1;user-select:none;z-index:0}
.xtop .dp,.xtop .wd{position:relative;z-index:1}
.xbody{padding:26px 24px 28px}
.xtag{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-family:var(--mono);font-size:13px;color:var(--dim)}
.tg{padding:5px 12px;border-radius:999px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tg.p{color:var(--purple);background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.35)}
.tg.b{color:var(--blue2);background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35)}
.tg.g{color:var(--green2);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35);display:inline-flex;align-items:center;gap:8px}
.xbody h3{font-size:clamp(24px,5.6vw,32px);font-weight:600;letter-spacing:-.02em;line-height:1.2}
.xbody h3.gr{color:var(--green2)}
.org{font-size:19px;font-weight:500;margin:6px 0 4px;color:var(--blue2)}
.org.gr{color:var(--green2)}
.loc{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:15px}
.loc svg{width:14px;height:14px}
.impact{margin:22px 0;padding:16px 18px;border:1px solid rgba(34,197,94,.25);border-radius:14px;background:rgba(34,197,94,.05)}
.impact small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.impact b{font-size:24px;font-weight:600;color:var(--green2);letter-spacing:-.01em}
.xl li{color:var(--muted);font-size:15px;padding-left:26px;position:relative;margin:11px 0}
.xl li::before{content:"→";position:absolute;left:0;color:var(--blue)}
.xl li b{color:var(--text);font-weight:600}
.stk{margin-top:20px;font-family:var(--mono);font-size:12px;color:var(--dim);margin-bottom:10px}
.earlier{margin-top:6px;font-family:var(--mono);font-size:13px;color:var(--dim);line-height:1.8}
.earlier b{color:var(--muted);font-weight:500}

/* ===== CONTACT ===== */
.contact-grid{display:grid;gap:32px;margin-top:36px;max-width:1000px}
.rows{display:grid;gap:12px}
.row{display:flex;gap:14px;align-items:center;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--card);transition:border-color .25s}
a.row:hover{border-color:var(--blue)}
.ico{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(59,130,246,.12);color:var(--blue2);flex:none}
.ico svg{width:20px;height:20px}
.row small{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.12em}
.row span{font-size:16px;word-break:break-all}
form{display:grid;gap:18px}
label{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;display:block;margin-bottom:8px}
input,textarea{width:100%;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:#0d0d10;color:var(--text);font:inherit;font-size:16px;outline:none;transition:border-color .2s}
input::placeholder,textarea::placeholder{color:#5b5b64}
input:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:170px;resize:vertical}
form .btn{width:100%;padding:18px;font-size:18px;border-radius:16px}
.btn svg{width:20px;height:20px}
@media(min-width:900px){.contact-grid{grid-template-columns:.8fr 1.2fr}}

/* ===== MARQUEE ===== */
.marquee{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg2);overflow:hidden;white-space:nowrap;margin-top:50px}
.mq{display:inline-flex;animation:mq 30s linear infinite;padding:20px 0}
.mq span{font-size:14px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:0 24px;display:inline-flex;align-items:center;gap:24px}
.mq span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
@keyframes mq{to{transform:translateX(-50%)}}

/* ===== FOOTER ===== */
footer{background:var(--bg)}
.foot{display:grid;gap:40px;padding:56px 0 34px}
.foot .logo{font-size:30px}
.foot p{color:var(--muted);font-size:18px;max-width:420px;margin:16px 0 22px}
.meta{display:grid;gap:8px;font-family:var(--mono);font-size:14px;color:var(--muted)}
.meta .av{color:var(--green2);display:flex;align-items:center;gap:8px}
.meta div{display:flex;align-items:center;gap:8px}
.meta svg{width:15px;height:15px}
.foot h5{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:20px}
.sm li{margin:0}
.sm a{display:block;padding:12px 0 12px 30px;font-size:18px;color:var(--text);transition:color .2s}
.sm a:hover{color:var(--blue2)}
.chips2{display:flex;flex-wrap:wrap;gap:10px}
.sc{display:inline-flex;align-items:center;gap:9px;padding:11px 16px;border:1px solid var(--line);border-radius:12px;font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--bg2);transition:.2s}
.sc:hover{border-color:var(--blue);color:var(--text)}
.sc svg{width:18px;height:18px}
.start{display:inline-flex;align-items:center;gap:10px;margin-top:26px;padding:15px 24px;border:1px solid rgba(59,130,246,.45);border-radius:12px;background:rgba(59,130,246,.08);color:var(--blue2);font-family:var(--mono);font-size:15px;font-weight:700;transition:.2s}
.start:hover{background:rgba(59,130,246,.18)}
.copy{border-top:1px solid var(--line);padding:24px 0 40px;display:flex;flex-direction:column;align-items:center;gap:18px;font-family:var(--mono);font-size:13px;color:var(--dim);text-align:center}
.copy .hrt{color:#ef4444}
.top{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border:1px solid var(--line2);border-radius:999px;color:var(--muted);transition:.2s}
.top:hover{border-color:var(--blue);color:var(--text)}
@media(min-width:900px){.foot{grid-template-columns:1.3fr .7fr 1fr}.copy{flex-direction:row;justify-content:space-between}}
